[project]
name = "asm-agent"
version = "0.1.0"
description = "Passive attack-surface reporting CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "dnspython>=2.7,<3",
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "pydantic>=2.10,<3",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "typer>=0.15,<1",
]

[project.scripts]
asm-agent = "asm_agent.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asm_agent"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["asm_agent"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["asm_agent"]
